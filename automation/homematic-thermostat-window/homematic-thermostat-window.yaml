blueprint:
  name: Homematic Thermostat Window Control
  description: >-
    Switches a Homematic thermostat to "off" while one or more window contacts are
    open and back to "auto" once all windows are closed again.
  domain: automation
  input:
    thermostat:
      name: Thermostat
      description: The Homematic thermostat (climate entity) to control.
      selector:
        entity:
          domain: climate
          integration: homematicip_local
    window_sensors:
      name: Window Contacts
      description: One or more window contacts. The thermostat stays off as long as at least one is open.
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    open_delay:
      name: Open Delay
      description: How long a window must stay open before the thermostat is turned off.
      default:
        hours: 0
        minutes: 1
        seconds: 0
      selector:
        duration: {}
    close_delay:
      name: Close Delay
      description: How long all windows must stay closed before the thermostat is switched back to auto.
      default:
        hours: 0
        minutes: 0
        seconds: 30
      selector:
        duration: {}

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input window_sensors
    from: "off"
    to: "on"
    for: !input open_delay
    id: window_open
  - trigger: state
    entity_id: !input window_sensors
    to: "off"
    for: !input close_delay
    id: window_closed

actions:
  - choose:
      # Window opened: switch the thermostat off.
      - conditions:
          - condition: trigger
            id: window_open
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat
            data:
              hvac_mode: "off"

      # All windows closed: switch the thermostat back to auto.
      - conditions:
          - condition: trigger
            id: window_closed
          - condition: not
            conditions:
              - condition: state
                entity_id: !input window_sensors
                state: "on"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat
            data:
              hvac_mode: auto
