blueprint:
  name: Aqara Cube T1 Pro (Action Mode)
  description: >
    Automation for the Aqara Cube T1 Pro (CTP-R01) in Action Mode via Zigbee2MQTT.
    Supports tap, slide, flip90, flip180, rotate left/right, throw and shake.
    Requires the Zigbee2MQTT "Home Assistant experimental event entities"
    setting to be enabled so the cube is exposed as an `event` entity, and the
    cube to be switched into Action Mode (press the LINK button 5x swiftly).
  domain: automation
  input:
    cube_entity:
      name: Cube Event Entity
      description: The event entity for the Aqara Cube T1 Pro.
      selector:
        entity:
          domain: event

    action_tap:
      name: Tap
      description: Action to run when the cube is tapped while lying on a side.
      default: []
      selector:
        action: {}

    action_slide:
      name: Slide
      description: Action to run when the cube is slid across a surface.
      default: []
      selector:
        action: {}

    action_flip90:
      name: Flip 90°
      description: Action to run when the cube is flipped 90 degrees onto an adjacent side.
      default: []
      selector:
        action: {}

    action_flip180:
      name: Flip 180°
      description: Action to run when the cube is flipped 180 degrees onto the opposite side.
      default: []
      selector:
        action: {}

    action_rotate_left:
      name: Rotate Left
      description: Action to run when the cube is rotated counter-clockwise while lying on a side.
      default: []
      selector:
        action: {}

    action_rotate_right:
      name: Rotate Right
      description: Action to run when the cube is rotated clockwise while lying on a side.
      default: []
      selector:
        action: {}

    action_throw:
      name: Throw
      description: Action to run when the cube is thrown upward.
      default: []
      selector:
        action: {}

    action_shake:
      name: Shake
      description: Action to run when the cube is shaken.
      default: []
      selector:
        action: {}

mode: parallel
max: 10

triggers:
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [tap]
    id: tap
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [slide]
    id: slide
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [flip90]
    id: flip90
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [flip180]
    id: flip180
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [rotate_left]
    id: rotate_left
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [rotate_right]
    id: rotate_right
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [throw]
    id: throw
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [shake]
    id: shake

conditions: []

actions:
  - choose:
      - conditions: "{{ trigger.id == 'tap' }}"
        sequence: !input action_tap
      - conditions: "{{ trigger.id == 'slide' }}"
        sequence: !input action_slide
      - conditions: "{{ trigger.id == 'flip90' }}"
        sequence: !input action_flip90
      - conditions: "{{ trigger.id == 'flip180' }}"
        sequence: !input action_flip180
      - conditions: "{{ trigger.id == 'rotate_left' }}"
        sequence: !input action_rotate_left
      - conditions: "{{ trigger.id == 'rotate_right' }}"
        sequence: !input action_rotate_right
      - conditions: "{{ trigger.id == 'throw' }}"
        sequence: !input action_throw
      - conditions: "{{ trigger.id == 'shake' }}"
        sequence: !input action_shake
