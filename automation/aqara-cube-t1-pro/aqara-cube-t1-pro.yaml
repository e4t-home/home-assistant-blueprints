blueprint:
  name: Aqara Cube T1 Pro
  description: >
    Automation for the Aqara Cube T1 Pro (CTP-R01) in Action Mode via Zigbee2MQTT.
    Supports an action for each side landing face-up, rotate left/right, throw and shake.
    Requires the Zigbee2MQTT "Home Assistant experimental event entities"
    setting to be enabled so the cube is exposed as an `event` entity, plus a
    separate sensor entity that reports the numeric side currently facing up
    (the event entity itself does not carry this information).
  domain: automation
  input:
    cube_entity:
      name: Cube Event Entity
      description: The event entity for the Aqara Cube T1 Pro.
      selector:
        entity:
          domain: event

    cube_side_entity:
      name: Cube Side Sensor
      description: >
        Sensor entity that holds the number (1-6) of the side currently
        facing up. Zigbee2MQTT does not attach this to the event entity, so
        it must be read from a separate sensor entity (e.g. exposed by
        Zigbee2MQTT as a numeric "side" sensor for this device).
      selector:
        entity:
          domain: sensor

    action_side_1_up:
      name: Side 1 Up
      description: Action to run when the cube comes to rest with side 1 facing up.
      default: []
      selector:
        action: {}

    action_side_2_up:
      name: Side 2 Up
      description: Action to run when the cube comes to rest with side 2 facing up.
      default: []
      selector:
        action: {}

    action_side_3_up:
      name: Side 3 Up
      description: Action to run when the cube comes to rest with side 3 facing up.
      default: []
      selector:
        action: {}

    action_side_4_up:
      name: Side 4 Up
      description: Action to run when the cube comes to rest with side 4 facing up.
      default: []
      selector:
        action: {}

    action_side_5_up:
      name: Side 5 Up
      description: Action to run when the cube comes to rest with side 5 facing up.
      default: []
      selector:
        action: {}

    action_side_6_up:
      name: Side 6 Up
      description: Action to run when the cube comes to rest with side 6 facing up.
      default: []
      selector:
        action: {}

    action_rotate_left:
      name: Rotate Left
      description: Action to run when the cube is rotated counter-clockwise while lying on a side.
      default: []
      selector:
        action: {}

    action_rotate_right:
      name: Rotate Right
      description: Action to run when the cube is rotated clockwise while lying on a side.
      default: []
      selector:
        action: {}

    action_throw:
      name: Throw
      description: Action to run when the cube is thrown upward.
      default: []
      selector:
        action: {}

    action_shake:
      name: Shake
      description: Action to run when the cube is shaken.
      default: []
      selector:
        action: {}

mode: parallel
max: 10

triggers:
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [side_up]
    id: side_up
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [rotate_left]
    id: rotate_left
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [rotate_right]
    id: rotate_right
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [throw]
    id: throw
  - trigger: event.received
    target:
      entity_id: !input cube_entity
    options:
      event_type: [shake]
    id: shake

conditions: []

actions:
  - variables:
      side_entity: !input cube_side_entity
      side: "{{ states(side_entity) | int(0) }}"
  - choose:
      - conditions: "{{ trigger.id == 'side_up' and side == 1 }}"
        sequence: !input action_side_1_up
      - conditions: "{{ trigger.id == 'side_up' and side == 2 }}"
        sequence: !input action_side_2_up
      - conditions: "{{ trigger.id == 'side_up' and side == 3 }}"
        sequence: !input action_side_3_up
      - conditions: "{{ trigger.id == 'side_up' and side == 4 }}"
        sequence: !input action_side_4_up
      - conditions: "{{ trigger.id == 'side_up' and side == 5 }}"
        sequence: !input action_side_5_up
      - conditions: "{{ trigger.id == 'side_up' and side == 6 }}"
        sequence: !input action_side_6_up
      - conditions: "{{ trigger.id == 'rotate_left' }}"
        sequence: !input action_rotate_left
      - conditions: "{{ trigger.id == 'rotate_right' }}"
        sequence: !input action_rotate_right
      - conditions: "{{ trigger.id == 'throw' }}"
        sequence: !input action_throw
      - conditions: "{{ trigger.id == 'shake' }}"
        sequence: !input action_shake
